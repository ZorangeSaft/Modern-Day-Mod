 MAPMODE_MDM_STONE_ORE_DEPOSIT: "#T $mapmode_mdm_stone_ore_deposit_name$#!\nThis colors [locations|e] by the size of stone ore deposits in the [location|e].\n\nThe mapmode shows the value of the [mdm_stone_ore_deposit_size|e] variable, which represents the amount of stone ore resources available at this location.\n\n@adm! #color_yellow Strategy#! @adm!\nBuild mining infrastructure in locations with the largest deposits to maximize stone ore extraction and economic efficiency."
 MAPMODE_MDM_STONE_ORE_DEPOSIT_TT_LAND: "[ROOT.GetLocation.GetName] has an stone ore deposit size of [ROOT.GetLocation.MakeScope.Var('mdm_stone_ore_deposit_size').GetValue|Y]."
 MAPMODE_MDM_STONE_ORE_DEPOSIT_TT_NO_DEPOSIT: "[ROOT.GetLocation.GetName] does not have an stone ore deposit."
 MAPMODE_MDM_STONE_ORE_DEPOSIT_TT_WATER: "[ROOT.GetLocation.GetName] is not land so it does not have stone ore deposits."

