l_english:
 ###### mdm modern day mod

 #aluminium ore deposit mapmode

 mapmode_mdm_aluminium_ore_deposit_name: "Aluminium Ore Deposits"
 MAPMODE_MDM_ALUMINIUM_ORE_DEPOSIT: "#T $mapmode_mdm_aluminium_ore_deposit_name$#!\nThis colors [locations|e] by the size of aluminium ore deposits in the [location|e].\n\nThe mapmode shows the value of the [mdm_aluminium_ore_deposit_size|e] variable, which represents the amount of aluminium ore resources available at this location.\n\n@adm! #color_yellow Strategy#! @adm!\nBuild mining infrastructure in locations with the largest deposits to maximize aluminium ore extraction and economic efficiency."
 MAPMODE_MDM_ALUMINIUM_ORE_DEPOSIT_TT_LAND: "[ROOT.GetLocation.GetName] has an aluminium ore deposit size of [ROOT.GetLocation.MakeScope.Var('mdm_aluminium_ore_deposit_size').GetValue|Y]."
 MAPMODE_MDM_ALUMINIUM_ORE_DEPOSIT_TT_NO_DEPOSIT: "[ROOT.GetLocation.GetName] does not have an aluminium ore deposit."
 MAPMODE_MDM_ALUMINIUM_ORE_DEPOSIT_TT_WATER: "[ROOT.GetLocation.GetName] is not land so it does not have aluminium ore deposits."

 mdm_aluminium_ore_deposit_size_pink_legend_key: "100,000+ deposit"
 mdm_aluminium_ore_deposit_size_dark_blue_legend_key: "10,000 deposit"
 mdm_aluminium_ore_deposit_size_light_blue_legend_key: "1,000 deposit"
 mdm_aluminium_ore_deposit_size_green_legend_key: "100 deposit"
 mdm_aluminium_ore_deposit_size_yellow_legend_key: "10 deposit"
 mdm_aluminium_ore_deposit_size_red_legend_key: "1 deposit"
 mdm_aluminium_ore_deposit_size_dark_red_legend_key: "0 deposit"
 mdm_aluminium_ore_deposit_size_black_legend_key: "No deposit data"

