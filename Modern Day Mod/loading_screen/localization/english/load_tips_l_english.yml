l_english:
 LOADING_TIP_0: " #T \"This text is Big and at the top 1.\"#! \n #tooltip_subheading — this text is small and at the bottom, #italic this text is italic#!, 1521#!"
 LOADING_TIP_1: " #T \"This is a quote.\"#! \n #tooltip_subheading — this is who said the quote, #italic text can be italic#!, 2000#!"
 LOADING_TIP_2: " #T \"It is easier to imagine an end to the world than an end to capitalism.\"#! \n #tooltip_subheading — Fredric Jameson, 2003#!"
 LOADING_TIP_3: " #T \"GPUs are the paperclips we were warned about.\"#!"
 LOADING_TIP_4: " #T \"It's the economy, stupid!\"#! \n #tooltip_subheading — American political catchphrase, 1990s#!"
 LOADING_TIP_5: " #T \"We are going to put America first, and we are going to make America great again!\"#! \n #tooltip_subheading — Presidential candidate Donald Trump, 2016#!"
 LOADING_TIP_6: " #T \"The Industrial Revolution and its consequences have been a disaster for the human race.\"#! \n #tooltip_subheading — Ted Kaczynski,  the Unabomber, #italic Industrial Society and Its Future#!, 1995#!"
 LOADING_TIP_7: " #T \"A second plane hit the second tower. America is under attack.\"#! \n #tooltip_subheading — Andrew Card, White House Chief of Staff, 2001#!"
 LOADING_TIP_8: " #T \"States like these, and their terrorist allies, constitute an axis of evil, arming to threaten the peace of the world. By seeking weapons of mass destruction, these regimes pose a grave and growing danger.\"#! \n #tooltip_subheading — US President George W. Bush, on Iraq, Iran and North Korea, 2002#!"
 LOADING_TIP_9: " #T \"Je suis Charlie — 'I am Charlie'\"#! \n #tooltip_subheading — French slogan for freedom of speech and freedom of the press, 2015#!"
 LOADING_TIP_10: " #T \"I want you to listen to me. I'm going to say this again: I did not have sexual relations with that woman, Miss Lewinsky.\"#! \n #tooltip_subheading — US President Bill Clinton, 1998#!"
 LOADING_TIP_11: " #T \"Global warming, along with the cutting and burning of forests and other critical habitats, is causing the loss of living species at a level comparable to the extinction event that wiped out the dinosaurs 65 million years ago.\"#! \n #tooltip_subheading — Al Gore, #italic An Inconvenient Truth: The Planetary Emergency of Global Warming and What We Can Do About It#!, 2006#!"
 LOADING_TIP_12: " #T \"The greatest enemy of knowledge is not ignorance, it is the illusion of knowledge.\"#! \n #tooltip_subheading — Stephen Hawking, 2004#!"
 LOADING_TIP_13: " #T \"North Korea best not make any more threats to the United States. They will be met with fire and fury like the world has never seen.\"#! \n #tooltip_subheading — US President Donald Trump, 2017#!"
 LOADING_TIP_14: " #T \"Change will not come if we wait for some other person, or if we wait for some other time. We are the ones we've been waiting for. We are the change that we seek.\"#! \n #tooltip_subheading — Presidential candidate Barack Obama, 2008#!"
 LOADING_TIP_15: " #T \"Ask me my three main priorities for government, and I tell you: education, education, education.\"#! \n #tooltip_subheading — Tony Blair, future UK Prime Minister, 1996#!"
 LOADING_TIP_16: " #T \"You have stolen my dreams and my childhood with your empty words. How dare you!?\"#! \n #tooltip_subheading — Greta Thunberg, climate activist, 2019#!"
 LOADING_TIP_17: " #T \"If it doesn't fit, you must acquit.\"#! \n #tooltip_subheading — Johnnie Cochran, defense attorney of murder suspect O. J. Simpson, 1995#!"
 LOADING_TIP_18: " #T \"We can loudly proclaim from the rooftops - free at last!\"#! \n #tooltip_subheading — Nelson Mandela, victory speech at the end of Apartheid, 1994#!"
 LOADING_TIP_19: " #T \"Is math related to science?\"#! \n #tooltip_subheading — Katy Perry, pop star, 2017#!"
 LOADING_TIP_20: " #T \"We are America, second to none, and we own the finish line!\"#! \n #tooltip_subheading — Joe Biden, future US President, 2016#!"
 LOADING_TIP_21: " #T \"We beat the Germans twice, and now they're back.\"#! \n #tooltip_subheading — Margaret Thatcher, former UK Prime Minister, 1989#!"
 LOADING_TIP_22: " #T \"Much of human history has consisted of unequal conflicts between the haves and the have-nots.\"#! \n #tooltip_subheading — Jared Diamond, #italic Guns, Germs, and Steel: The Fates of Human Societies#!, 1997#!"
 LOADING_TIP_23: " #T \"I know words. I have the best words.\"#! \n #tooltip_subheading — Presidential candidate Donald Trump, 2015#!"
 LOADING_TIP_24: " #T \"A government big enough to give you everything you want is a government big enough to take everything you have.\"#! \n #tooltip_subheading — US President Gerald Ford, 1974#!"
 LOADING_TIP_25: " #T \"I am not the leader of Libya, I am the leader of the Revolution.\"#! \n #tooltip_subheading — Muammar Gaddafi, 2009#!"
 LOADING_TIP_26: " #T \"There is no state with a democracy except Libya on the whole planet.\"#! \n #tooltip_subheading — Muammar Gaddafi, 2006#!"
 LOADING_TIP_27: " #T \"The worst of times often create the best opportunities to make good deals.\"#! \n #tooltip_subheading — Donald Trump, #italic Trump: The Art of the Deal#!, 1987#!"
 LOADING_TIP_28: " #T \"A great company is a conspiracy to change the world; when you share your secret, the recipient becomes a fellow conspirator.\"#! \n #tooltip_subheading — Peter Thiel, #italic Zero to One: Notes on Startups, or How to Build the Future#!, 2014#!"
 LOADING_TIP_29: " #T \"Monopoly is the condition of every successful business.\"#! \n #tooltip_subheading — Peter Thiel, #italic Zero to One: Notes on Startups, or How to Build the Future#!, 2014#!"
 LOADING_TIP_30: " #T \"Whoever stands by a just cause cannot possibly be called a terrorist.\"#! \n #tooltip_subheading — Yasser Arafat, to the UN General Assembly, 1974#!"
 LOADING_TIP_31: " #T \"Peace for us means the destruction of Israel. We are preparing for an all-out war, a war which will last for generations.\"#! \n #tooltip_subheading — Yasser Arafat, 1980#!"
 LOADING_TIP_32: " #T \"Britain is blessed with a functioning political culture. It is dominated by people who live in London and who have often known each other since prep school. This makes it gossipy and often incestuous.\"#! \n #tooltip_subheading — David Brooks, 2011#!"
 LOADING_TIP_33: " #T \"When I look at Trump acolytes, I see a swarm of Neville Chamberlains who think they’re Winston Churchill.\"#! \n #tooltip_subheading — David Brooks, 2025#!"
 LOADING_TIP_34: " #T \"When you create an administration in which one man has all the power and everybody else has to flatter his voracious ego, stupidity results.\"#! \n #tooltip_subheading — David Brooks, 2025#!"
 LOADING_TIP_35: " #T \"We will not adopt the fantastic hypocrisy of modern conservatism which preaches the values of families and communities, while conducting a direct assault on them through reduced wages and conditions and job security.\"#! \n #tooltip_subheading — Australian Prime Minister Paul Keating, 1996#!"
 LOADING_TIP_36: " #T \"China is simply too big and too central to be ostracised.\"#! \n #tooltip_subheading — former Australian Prime Minister Paul Keating, 2021#!"
 LOADING_TIP_37: " #T \"A neighbor with one billion people equipped with nuclear bombs and has expanded its military outlays by double digits for 17 years in a row, and it is unclear as to what this is being used for. It is beginning to be a considerable threat.\"#! \n #tooltip_subheading — Japanese Prime Minister Tarō Asō, 2005#!"
 LOADING_TIP_38: " #T \"If I were an Englishman, I should esteem the man who advised a war with China to be the greatest living enemy of my country. You would be beaten in the end.\"#! \n #tooltip_subheading — Napoleon Bonaparte, 1817#!"
 LOADING_TIP_39: " #T \"Do not take it for granted that China is number two, and do not make the assumption that we will be number one.\"#! \n #tooltip_subheading — Chén Démíng, former Chinese Minister of Commerce, 2019#!"
 LOADING_TIP_40: " #T \"When our thousands of Chinese students abroad return home, you will see how China will transform itself.\"#! \n #tooltip_subheading — Dèng Xiǎopíng, paramount leader of China, c. 1978#!"
 LOADING_TIP_41: " #T \"The United States brags about its political system, but the President says one thing during the election, something else when he takes office, something else at midterm and something else when he leaves.\"#! \n #tooltip_subheading — Dèng Xiǎopíng, paramount leader of China, 1983#!"
 LOADING_TIP_42: " #T \"An educated, healthy and confident nation is harder to govern.\"#! \n #tooltip_subheading — Tony Benn, 2007#!"
 LOADING_TIP_43: " #T \"I call again for... the return of the sausages.\"#! \n #tooltip_subheading — UK Prime Minister Keir Starmer, 2024#!"
 LOADING_TIP_44: " #T \"It is not British to retreat to Europe's sidelines.\"#! \n #tooltip_subheading — UK Prime Minister Gordon Brown, 2016#!"
 LOADING_TIP_45: " #T \"The only winners from a Brexit would be Nigel Farage and Vladimir Putin; who would relish a divided Europe.\"#! \n #tooltip_subheading — Guy Verhofstadt, 2016#!"
 LOADING_TIP_46: " #T \"Before people crow about the absence of Weapons of Mass Destruction, I suggest they wait a bit.\"#! \n #tooltip_subheading — UK Prime Minister Tony Blair, 2003#!"
 LOADING_TIP_47: " #T \"The blunt truth about the politics of climate change is that no country will want to sacrifice its economy in order to meet this challenge.\"#! \n #tooltip_subheading — UK Prime Minister Tony Blair, 2005#!"
 LOADING_TIP_48: " #T \"This is not a clash between civilisations. It is a clash about civilisation.\"#! \n #tooltip_subheading — UK Prime Minister Tony Blair, 2006#!"
 LOADING_TIP_49: " #T \"In this day and age if you've got the technology then it's vital to use that technology to track people down. The number on the database should be the maximum number you can get.\"#! \n #tooltip_subheading — UK Prime Minister Tony Blair, 2006#!"
 LOADING_TIP_50: " #T \"But believe one thing, if nothing else. I did what I thought was right for our country.\"#! \n #tooltip_subheading — UK Prime Minister Tony Blair, resignation speech, 2007#!"
 LOADING_TIP_51: " #T \"We're waging a proxy war, but we're not giving our proxies the ability to do the job.\"#! \n #tooltip_subheading — former UK Prime Minister Boris Johnson, 2024#!"
 LOADING_TIP_52: " #T \"The Conservative Party thinks the whole thing is pathetic and Covid is just Nature's way of dealing with old people – and I am not entirely sure I disagree with them.\"#! \n #tooltip_subheading — UK Prime Minister Boris Johnson, 2020#!"
 LOADING_TIP_53: " #T \"I had the best vaccine, it was the virus. No side effects.\"#! \n #tooltip_subheading — Brazilian President Jair Bolsonaro, 2020#!"
 LOADING_TIP_54: " #T \"We want to have a great Brazil just like Trump wants to have a great America.\"#! \n #tooltip_subheading — Brazilian President Jair Bolsonaro, 2019#!"
 LOADING_TIP_55: " #T \"He steals, but he delivers\"#! \n #tooltip_subheading — Brazilian political slogan#!"
 LOADING_TIP_56: " #T \"I stole, yes, but not as much as the current mayor.\"#! \n #tooltip_subheading — former Brazilian mayor José Maria Monção, 2020#!"
 LOADING_TIP_57: " #T \"You know what I am? I’m a nationalist. OK? I’m a nationalist.\"#! \n #tooltip_subheading — US President Donald Trump, 2018#!"
 LOADING_TIP_58: " #T \"Genius is play, and man's capacity for achieving genius is infinite, and many may achieve genius only through play.\"#! \n #tooltip_subheading — William Saroyan, 1936#!"
 LOADING_TIP_59: " #T \"Relations between States and within States are correct to the extent that they respect the truth. When, instead, truth is violated, peace is threatened, law is endangered, then, as a logical consequence, forms of injustice are unleashed.\"#! \n #tooltip_subheading — Pope Benedict XVI, 2006#!"
 LOADING_TIP_60: " #T \"Our social mission as a manufacturer is only realized when products reach, are used by, and satisfy the customer... We need to take the customer's skin temperature daily.\"#! \n #tooltip_subheading — Kōnosuke Matsushita, 1984#!"
 LOADING_TIP_61: " #T \"Nothing is harder to understand than a symbolic work. A symbol always transcends the one who makes use of it and makes him say in reality more than he is aware of expressing.\"#! \n #tooltip_subheading — Albert Camus, 1942#!"
 LOADING_TIP_62: " #T \"Humanity is at a crossroads. Building a community with a shared future for mankind is the right path forward and the trend of the times. The world today is undergoing profound changes unseen in a century. Destabilising, uncertain factors and challenges continue to arise.\"#! \n #tooltip_subheading — Wèi Fènghé, 2019#!"
 LOADING_TIP_63: " #T \"Propaganda is the kitchen of war, Propaganda is war itself. First comes the militarisation of national holidays, then the news is replaced by propaganda shows.\"#! \n #tooltip_subheading — Dmitry Muratov, 2022#!"
 LOADING_TIP_64: " #T \"We are at the beginning of a revolution that is fundamentally changing the way we live, work, and relate to one another. In its scale, scope and complexity, what I consider to be the fourth industrial revolution is unlike anything humankind has experienced before.\"#! \n #tooltip_subheading — Klaus Schwab, 2016#!"
 LOADING_TIP_65: " #T \"The nature of war is not going to change. It's still a political act. It's a decision by humans to impose their political will on their opponent by the use of violence.\"#! \n #tooltip_subheading — Mark Milley, 2022#!"
 LOADING_TIP_66: " #T \"As we pass on the memories of disasters and pandemics to our posterity, we can improve our preparedness for forthcoming catastrophes. In this way, we can help to build a society in which everyone, with no one left behind, will be able to enjoy daily lives filled with health and happiness.\"#! \n #tooltip_subheading — Emperor Naruhito, 2021#!"
 LOADING_TIP_67: " #T \"Freedom is a unique concept that everyone interprets differently.\"#! \n #tooltip_subheading — Dmitry Medvedev, 2012#!"
 LOADING_TIP_68: " #T \"It doesn't matter whether the cat is black or white, as long as it catches mice.\"#! \n #tooltip_subheading — Dèng Xiǎopíng, 1962#!"